[project]
name = "clipper"
version = "0.2.0"
description = "Talking-head video editor: clip mode (long video -> shorts) and polish mode (raw take -> finished video), driven by an EDL, with DeepSeek as the editor."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "av>=12",
    "faster-whisper>=1.1",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "playwright>=1.48",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "imageio-ffmpeg>=0.5",
    "certifi",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Voice-based speaker counting for the single-speaker check.
voices = ["sherpa-onnx>=1.10", "certifi"]
dev = ["pytest>=8", "httpx"]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
