<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--param-color,#fff)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
.wrap{position:absolute;top:9vh;left:0;right:0;display:flex;justify-content:center}
.box{max-width:84vw;padding:2.4vmin 4vmin;border-radius:2vmin;background:var(--param-background,#fff);
  color:var(--param-color,#111);font-size:6.2vmin;line-height:1.12;font-weight:800;text-align:center;
  box-shadow:0 .8vmin 3vmin rgba(0,0,0,.35);
  animation:pop .35s cubic-bezier(.2,1.4,.4,1) both,out .25s ease-in calc(var(--duration,3s) - .25s) forwards}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.92)}}
</style></head>
<body><div class="wrap"><div class="box" data-param="title">Title</div></div></body></html>
