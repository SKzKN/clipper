<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--param-color,#fff)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);
  animation:fade-in .3s ease-out both,fade-out .3s ease-in calc(var(--duration,3s) - .3s) forwards}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 8vw;
  animation:rise .45s cubic-bezier(.2,.8,.2,1) .1s both,fade-out .25s ease-in calc(var(--duration,3s) - .3s) forwards}
h1{margin:0;font-size:9vmin;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.rule{width:14vmin;height:.9vmin;margin:3vmin 0;background:var(--param-accent,#FFD400);transform-origin:center;
  animation:grow .4s ease-out .3s both}
p{margin:0;font-size:4.2vmin;font-weight:500;opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(4vmin)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></head>
<body>
  <div class="scrim"></div>
  <div class="card">
    <h1 data-param="title">Title</h1>
    <div class="rule"></div>
    <p data-param="subtitle" data-if="subtitle"></p>
  </div>
</body></html>
