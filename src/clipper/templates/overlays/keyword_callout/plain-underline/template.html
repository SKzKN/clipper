<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--param-color,#fff)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
.wrap{position:absolute;top:11vh;height:18vh;left:0;right:0;display:flex;align-items:center;justify-content:center}
.kw{display:inline-block;animation:fade-out .2s ease-in calc(var(--duration,1.8s) - .2s) forwards}
.word{font-size:8.4vmin;font-weight:900;text-transform:uppercase;line-height:1;white-space:nowrap;
  -webkit-text-stroke:.5vmin #000;paint-order:stroke fill;text-shadow:0 .5vmin 1.6vmin rgba(0,0,0,.5);
  animation:slam .25s cubic-bezier(.2,1.5,.4,1) both}
.under{height:1.1vmin;margin-top:1.2vmin;border-radius:1vmin;background:var(--param-accent,#FF3B30);
  transform-origin:left center;animation:swipe .3s ease-out .15s both}
@keyframes slam{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></head>
<body><div class="wrap"><div class="kw">
  <div class="word" data-param="text">Keyword</div>
  <div class="under"></div>
</div></div></body></html>
